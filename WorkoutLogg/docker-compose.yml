services:
  postgres:
    image: postgres:17-alpine
    container_name: workoutlogger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workoutLogger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 051099
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workoutlogger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: workoutlogger-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  # === KAFKA ===
  kafka:
    image: apache/kafka:3.8.0
    container_name: workoutlogger-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://202.148.55.20:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_MESSAGE_MAX_BYTES: 10485760        # 10 MB (broker max incoming message)
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760  # 10 MB (replication fetch, должен >= MESSAGE_MAX_BYTES)
      KAFKA_MAX_REQUEST_SIZE: 10485760         # 10 MB (producer request size)
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: workoutlogger-kafka-ui
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # === OPENSEARCH ===
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: workoutlogger-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: workoutlogger-opensearch-ui
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy

  # === GRAFANA ===
  grafana:
    image: grafana/grafana:11.3.0
    container_name: workoutlogger-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-opensearch-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - opensearch

  events-consumer:
    build:
      context: .
      dockerfile: WorkoutLogger.EventsConsumer/Dockerfile
    container_name: workoutlogger-events-consumer
    restart: unless-stopped
    environment:
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__Topics__AuthEvents: "auth-events"
      OpenSearch__Url: "http://opensearch:9200"
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: WorkoutLogger.WebApi/Dockerfile
    container_name: workoutlogger-api
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: CertPassword123
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=workoutLogger;Username=postgres;Password=051099"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:9092"
      OpenSearch__Url: "http://opensearch:9200"
      AuthConfiguration__Key: "your_secret_key_here_change_it_please"
      AuthConfiguration__Issuer: "DevTips"
      AuthConfiguration__Audience: "DevTips"
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  opensearch-data:
  grafana-data: