name: Build & Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-backend:
    name: Backend build & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore WebApi
        run: dotnet restore WorkoutLogg/WorkoutLogger.WebApi/WorkoutLogger.WebApi.csproj

      - name: Restore EventsConsumer
        run: dotnet restore WorkoutLogg/WorkoutLogger.EventsConsumer/WorkoutLogger.EventsConsumer.csproj

      - name: Restore Tests
        run: dotnet restore WorkoutLogg/Modules.Users.Tests/Modules.Users.Tests.csproj

      # The MAUI client (WorkoutLogg) and the Aspire AppHost (which references it)
      # are intentionally excluded: they require mobile workloads that are not
      # needed to validate backend changes. See the MAUI CI task for follow-up.
      - name: Build WebApi
        run: dotnet build WorkoutLogg/WorkoutLogger.WebApi/WorkoutLogger.WebApi.csproj --configuration Release --no-restore

      - name: Build EventsConsumer
        run: dotnet build WorkoutLogg/WorkoutLogger.EventsConsumer/WorkoutLogger.EventsConsumer.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test WorkoutLogg/Modules.Users.Tests/Modules.Users.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  build-maui:
    name: MAUI Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore MAUI client
        run: dotnet restore WorkoutLogg/WorkoutLogg/WorkoutLogg.csproj

      # Debug configuration: Release enables AOT (RunAOTCompilation=true),
      # which is much slower and unnecessary for PR validation.
      # The Aspire AppHost is not built on Linux: it references the MAUI
      # project with TargetFramework=net10.0, which only exists on Windows.
      - name: Build MAUI client (Android)
        run: dotnet build WorkoutLogg/WorkoutLogg/WorkoutLogg.csproj -f net10.0-android --configuration Debug --no-restore
